[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "practai-fall-2026-midterm"
version = "0.1.0"
description = "Practical AI Fall 2026 midterm materials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "torch",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["exam"]
