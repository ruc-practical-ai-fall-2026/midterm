[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "practai-fall-2026-midterm"
version = "0.1.0"
description = "Practical AI Fall 2026 midterm materials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "captum",
    "ipykernel",
    "matplotlib",
    "numpy",
    "onnx",
    "onnxscript",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "torch",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["exam"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "nbqa>=1.10.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
